name: Tests & Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -m "unit and not integration" --cov=retrieval --cov=generation --cov=cache --cov=metadata --cov=query --cov=reranking --cov-report=xml --cov-fail-under=0 -x
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test_key_gsk_xxx' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_key_sk_xxx' }}

      - name: Run adversarial evaluation
        run: |
          python -m tests.adversarial_eval
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          coverage-badge -o coverage.svg -f

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-${{ matrix.python-version }}
          path: coverage.svg

  coverage-report:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run full test suite with coverage
        run: |
          pytest tests/ -v --cov=retrieval --cov=generation --cov=cache --cov=metadata --cov=query --cov=reranking --cov-report=html --cov-report=term-missing --cov-fail-under=0

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Check code formatting with black
        run: |
          black --check tests/
        continue-on-error: true

      - name: Check import ordering with isort
        run: |
          isort --check-only tests/
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
