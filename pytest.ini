[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=finguard
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
markers =
    unit: Unit tests (fast, no external calls)
    integration: Integration tests (may call external APIs)
    slow: Slow tests (skip with -m "not slow")
    llm: Tests requiring LLM API calls (mocked by default)
    cache: Cache-specific tests
    retrieval: Retrieval pipeline tests
    adversarial: Adversarial evaluation tests
